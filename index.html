<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="game">
  <header>
    <h1>Wordle</h1>
    <p>Guess the five letter word in six tries.</p>
  </header>

  <div class="board" id="board" aria-label="Guess board"></div>
  <p class="message" id="message" hidden></p>

  <div class="keyboard" id="keyboard"></div>

  <div class="footer">
    <button class="new" id="newBtn" type="button">New word</button>
    <p class="hint">Green is right place, yellow is right letter.</p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
